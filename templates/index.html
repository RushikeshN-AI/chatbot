<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Chatbot</title>
</head>
<body>
    <h1>📈 Stock Chatbot</h1>

    <form method="post">
        <input type="text" name="question" placeholder="Ask about AAPL stock..." required>
        <button type="submit">Ask</button>
    </form>

    {% if response %}
        <p><b>Bot:</b> {{ response }}</p>
    {% endif %}

    {% if chart %}
        <h3>Latest Stock Chart</h3>
        <img src="{{ chart }}" alt="Stock Chart" width="600">
    {% endif %}
</body>
</html>
